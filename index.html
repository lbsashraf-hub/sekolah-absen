<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Presensi Piket</title>
    <!-- Konfigurasi PWA untuk Install ke HP -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-splash {
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-text-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        .fade-out-splash {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
        }

        .fade-in-main {
            animation: fadeInScale 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden">

    <!-- ================= PREMIUM SPLASH SCREEN (OPENING) ================= -->
    <div id="splash-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="absolute w-72 h-72 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
        <div class="absolute w-72 h-72 bg-teal-500/10 rounded-full blur-3xl pointer-events-none -bottom-10 -right-10"></div>

        <div class="relative z-10 animate-splash mb-6">
            <div class="relative flex items-center justify-center w-24 h-24 rounded-3xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-cyan-400 p-0.5 shadow-2xl shadow-emerald-900/50">
                <div class="w-full h-full bg-slate-950 rounded-[22px] flex items-center justify-center">
                    <i class="fa-solid fa-fingerprint text-4xl text-transparent bg-clip-text bg-gradient-to-tr from-emerald-400 to-teal-300"></i>
                </div>
            </div>
        </div>

        <div class="relative z-10 animate-text-up space-y-2 mb-8">
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Portal Presensi Piket</h1>
            <p class="text-xs text-slate-400 font-medium">Sistem Pemindai Kehadiran Guru Terpadu</p>
        </div>

        <div class="relative z-10 animate-text-up px-4 py-2.5 bg-slate-900/80 border border-slate-800/80 rounded-2xl shadow-lg backdrop-blur-md">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <p class="text-[11px] font-semibold text-emerald-400 tracking-wide">
                    Website ini dibuat oleh Daeng Ashraf, S.Sos
                </p>
            </div>
        </div>

        <div class="absolute bottom-12 w-36 h-1 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
            <div class="w-full h-full bg-gradient-to-r from-emerald-500 to-teal-400 animate-pulse"></div>
        </div>
    </div>

    <!-- ================= KONTEN UTAMA APLIKASI ================= -->
    <div id="main-content" class="max-w-md w-full bg-slate-900/90 border border-slate-800/80 rounded-3xl shadow-2xl p-6 relative overflow-hidden opacity-0 backdrop-blur-xl">
        
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Utama -->
        <div class="text-center mb-5 relative z-10">
            <div class="inline-flex items-center justify-center bg-gradient-to-tr from-emerald-600 to-teal-400 text-slate-950 w-12 h-12 rounded-2xl mb-2.5 shadow-lg shadow-emerald-900/30">
                <i class="fa-solid fa-clipboard-user text-xl"></i>
            </div>
            <h2 class="text-base font-extrabold text-white tracking-tight">Input Presensi Piket</h2>
            <p class="text-[11px] text-slate-400 mt-0.5">Catat kehadiran, izin, atau alfa guru dengan mudah</p>
            
            <div class="inline-block mt-2.5 px-3 py-1 bg-slate-800/60 border border-slate-700/50 rounded-full">
                <p class="text-[9px] font-medium text-slate-400">
                    Developer: <span class="text-emerald-400 font-semibold">Daeng Ashraf, S.Sos</span>
                </p>
            </div>
        </div>

        <!-- Form Input & Status -->
        <div class="mb-4 relative z-10 space-y-3">
            
            <!-- Pilihan Status Kehadiran -->
            <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-1.5">Pilih Status:</label>
                <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" onclick="setStatusKehadiran('Hadir')" id="btn-hadir" class="py-2.5 px-2 rounded-xl text-xs font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-300 transition-all shadow-sm">
                        <i class="fa-solid fa-check mr-1"></i> Hadir
                    </button>
                    <button type="button" onclick="setStatusKehadiran('Izin')" id="btn-izin" class="py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-800 bg-slate-950 text-slate-400 hover:border-slate-700 transition-all shadow-sm">
                        <i class="fa-solid fa-info-circle mr-1"></i> Izin
                    </button>
                    <button type="button" onclick="setStatusKehadiran('Alfa')" id="btn-alfa" class="py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-800 bg-slate-950 text-slate-400 hover:border-slate-700 transition-all shadow-sm">
                        <i class="fa-solid fa-xmark mr-1"></i> Alfa
                    </button>
                </div>
            </div>

            <!-- FORM MODE HADIR -->
            <div id="form-hadir" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1.5">Data QR / Teks Absen:</label>
                    <textarea id="input-teks" rows="2" placeholder="Tempel teks QR di sini (cth: ABSEN-GURU|Nama...)" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition-all resize-none"></textarea>
                </div>

                <!-- Opsi Manual Kelas & Keterangan Telat -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 mb-1">Pilih Kelas (Opsional/Telat):</label>
                        <select id="select-kelas-manual" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            <option value="Otomatis">Ikuti Jadwal Otomatis</option>
                            <option value="Kelas 10">Kelas 10</option>
                            <option value="Kelas 11">Kelas 11</option>
                            <option value="Kelas 12">Kelas 12</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-400 mb-1">Catatan Waktu:</label>
                        <input type="text" id="input-catatan-hadir" placeholder="Cth: Telat 15 mnt" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>

            <!-- FORM MODE IZIN -->
            <div id="form-izin" class="space-y-3 hidden">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1.5">Nama Guru:</label>
                    <input type="text" id="input-nama-izin" placeholder="Contoh: Budi Santoso, S.Pd" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500 transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1.5">Keterangan Izin:</label>
                    <input type="text" id="input-keterangan" placeholder="Contoh: Sakit / Keperluan Keluarga / Dinas" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500 transition-all">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1.5">Status Pemberian Tugas:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="setStatusTugas('Sudah Memberikan Tugas')" id="btn-tugas-sudah" class="py-2 px-2.5 rounded-xl text-[11px] font-bold border border-sky-500 bg-sky-500/20 text-sky-300 transition-all shadow-sm">
                            <i class="fa-solid fa-circle-check mr-1"></i> Sudah Tugas
                        </button>
                        <button type="button" onclick="setStatusTugas('Belum Memberikan Tugas')" id="btn-tugas-belum" class="py-2 px-2.5 rounded-xl text-[11px] font-semibold border border-slate-800 bg-slate-950 text-slate-400 hover:border-slate-700 transition-all shadow-sm">
                            <i class="fa-solid fa-circle-xmark mr-1"></i> Belum Tugas
                        </button>
                    </div>
                </div>
            </div>

            <!-- FORM MODE ALFA -->
            <div id="form-alfa" class="space-y-3 hidden">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1.5">Nama Guru (Alfa):</label>
                    <input type="text" id="input-nama-alfa" placeholder="Contoh: Ahmad Zaelani, S.Pd" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-rose-500 transition-all">
                </div>
            </div>

            <button onclick="prosesDataInput()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-extrabold py-3.5 px-4 rounded-2xl text-xs transition-all shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2 transform active:scale-95 duration-150">
                <i class="fa-solid fa-paper-plane text-sm"></i> Kirim & Simpan Absen
            </button>
        </div>

        <!-- Area Status / Hasil -->
        <div id="status-box" class="hidden p-3.5 rounded-2xl border text-xs text-center transition-all mb-4 relative z-10"></div>

        <!-- Informasi Footer -->
        <div class="text-center relative z-10 pt-3 border-t border-slate-800/60">
            <p class="text-[10px] text-slate-500">SMA PUNYE GAYE &bull; Terhubung ke server SMA</p>
        </div>
    </div>

    <script>
        // Pendaftaran Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => { console.log('Service Worker berhasil didaftarkan!', reg); })
                    .catch((err) => { console.log('Pendaftaran Service Worker gagal:', err); });
            });
        }

        // Pengaturan Durasi Splash Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-content');
                
                splash.classList.add('fade-out-splash');
                main.classList.remove('opacity-0');
                main.classList.add('fade-in-main');
            }, 2500);
        });

        // Konfigurasi Supabase
        const SUPABASE_URL = 'https://uxutxeclfcvcvdiydmpw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_UMV1G-z6vj5x0sRKlvZfVA_ap4qZFkA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedStatus = 'Hadir';
        let selectedTugas = 'Sudah Memberikan Tugas';
        let isProcessing = false;

        // Daftar nama guru piket
        const listGuruPiket = ["Hildan", "Nadiv", "Resma"];

        // Fungsi helper untuk mendapatkan nama hari ini dalam Bahasa Indonesia
        function getHariIniIndonesia() {
            const listHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const sekarang = new Date();
            return listHari[sekarang.getDay()];
        }

        // Fungsi pencocokan jadwal dan deteksi piket otomatis yang telah diperbarui
        async function deteksiKelasDanMapelOtomatis(namaGuru, waktuScan) {
            const hariIni = getHariIniIndonesia();
            const jamMenitScan = waktuScan.substring(0, 5);

            // Cek apakah guru termasuk daftar piket
            const adalahPiket = listGuruPiket.some(piket => namaGuru.toLowerCase().includes(piket.toLowerCase()));

            try {
                const { data, error } = await supabaseClient
                    .from('jadwal_mengajar')
                    .select('*')
                    .ilike('nama_guru', `%${namaGuru}%`)
                    .eq('hari', hariIni);

                if (error) {
                    console.error("Gagal query jadwal:", error.message);
                    return { 
                        kelas: adalahPiket ? "Piket Sekolah" : "Kelas Umum", 
                        mapel: adalahPiket ? "Tugas Piket" : "Kegiatan Umum" 
                    };
                }

                if (data && data.length > 0) {
                    const jadwalCocok = data.find(j => {
                        const jamMulaiField = j.jam_mulai || j.jam_masuk || j.mulai || "00:00";
                        const jamSelesaiField = j.jam_selesai || j.jam_keluar || j.selesai || "23:59";

                        const mulai = String(jamMulaiField).substring(0, 5);
                        const selesai = String(jamSelesaiField).substring(0, 5);

                        return jamMenitScan >= mulai && jamMenitScan <= selesai;
                    });

                    // Jika ditemukan jadwal mengajar pada jam tersebut, ambil kelas dan mapel mengajarnya
                    if (jadwalCocok) {
                        return {
                            kelas: jadwalCocok.kelas || jadwalCocok.nama_kelas || "Kelas Umum",
                            mapel: jadwalCocok.mapel || jadwalCocok.mata_pelajaran || jadwalCocok.pelajaran || "Mata Pelajaran"
                        };
                    }
                }

                // Jika tidak ada jadwal mengajar, cek apakah dia guru piket
                if (adalahPiket) {
                    return { 
                        kelas: "Piket Sekolah", 
                        mapel: "Tugas Piket" 
                    };
                }

                // Default jika bukan guru piket dan tidak ada jadwal
                return { 
                    kelas: "Kelas Umum", 
                    mapel: "Kegiatan Umum" 
                };

            } catch (err) {
                console.error("Error pengecekan jadwal:", err);
                return { 
                    kelas: adalahPiket ? "Piket Sekolah" : "Kelas Umum", 
                    mapel: adalahPiket ? "Tugas Piket" : "Kegiatan Umum" 
                };
            }
        }

        function setStatusKehadiran(status) {
            selectedStatus = status;
            
            const btnHadir = document.getElementById('btn-hadir');
            const btnIzin = document.getElementById('btn-izin');
            const btnAlfa = document.getElementById('btn-alfa');
            
            const formHadir = document.getElementById('form-hadir');
            const formIzin = document.getElementById('form-izin');
            const formAlfa = document.getElementById('form-alfa');

            btnHadir.className = "py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-800 bg-slate-950 text-slate-400 transition-all shadow-sm";
            btnIzin.className = "py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-800 bg-slate-950 text-slate-400 transition-all shadow-sm";
            btnAlfa.className = "py-2.5 px-2 rounded-xl text-xs font-semibold border border-slate-800 bg-slate-950 text-slate-400 transition-all shadow-sm";

            formHadir.classList.add('hidden');
            formIzin.classList.add('hidden');
            formAlfa.classList.add('hidden');

            if (status === 'Hadir') {
                btnHadir.className = "py-2.5 px-2 rounded-xl text-xs font-bold border border-emerald-500 bg-emerald-500/20 text-emerald-300 transition-all shadow-sm";
                formHadir.classList.remove('hidden');
            } else if (status === 'Izin') {
                btnIzin.className = "py-2.5 px-2 rounded-xl text-xs font-bold border border-sky-500 bg-sky-500/20 text-sky-300 transition-all shadow-sm";
                formIzin.classList.remove('hidden');
            } else if (status === 'Alfa') {
                btnAlfa.className = "py-2.5 px-2 rounded-xl text-xs font-bold border border-rose-500 bg-rose-500/20 text-rose-300 transition-all shadow-sm";
                formAlfa.classList.remove('hidden');
            }
        }

        function setStatusTugas(statusTugas) {
            selectedTugas = statusTugas;

            const btnSudah = document.getElementById('btn-tugas-sudah');
            const btnBelum = document.getElementById('btn-tugas-belum');

            btnSudah.className = "py-2 px-2.5 rounded-xl text-[11px] font-semibold border border-slate-800 bg-slate-950 text-slate-400 transition-all shadow-sm";
            btnBelum.className = "py-2 px-2.5 rounded-xl text-[11px] font-semibold border border-slate-800 bg-slate-950 text-slate-400 transition-all shadow-sm";

            if (statusTugas === 'Sudah Memberikan Tugas') {
                btnSudah.className = "py-2 px-2.5 rounded-xl text-[11px] font-bold border border-sky-500 bg-sky-500/20 text-sky-300 transition-all shadow-sm";
            } else {
                btnBelum.className = "py-2 px-2.5 rounded-xl text-[11px] font-bold border border-rose-500 bg-rose-500/20 text-rose-300 transition-all shadow-sm";
            }
        }

        function tampilkanStatus(pesan, tipe = 'sukses') {
            const box = document.getElementById('status-box');
            box.classList.remove('hidden', 'bg-emerald-500/15', 'border-emerald-500/40', 'text-emerald-300', 'bg-rose-500/15', 'border-rose-500/40', 'text-rose-300');
            
            if (tipe === 'sukses') {
                box.classList.add('bg-emerald-500/15', 'border-emerald-500/40', 'text-emerald-300');
                box.innerHTML = `<i class="fa-solid fa-circle-check text-base mb-1 block"></i><span class="font-bold text-xs block mb-0.5">Berhasil!</span>${pesan}`;
            } else {
                box.classList.add('bg-rose-500/15', 'border-rose-500/40', 'text-rose-300');
                box.innerHTML = `<i class="fa-solid fa-circle-xmark text-base mb-1 block"></i><span class="font-bold text-xs block mb-0.5">Gagal!</span>${pesan}`;
            }
        }

        async function prosesDataInput() {
            if (isProcessing) return;

            const t = new Date();
            const tanggalHariIni = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
            const waktuSekarang = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')}`;

            let namaGuru = '';
            let tokenValidasi = 'MANUAL-SYSTEM';
            let statusSimpan = 'Hadir';
            let keteranganSimpan = 'Hadir via Scan QR';
            let statusTugasSimpan = 'N/A';
            let kelasSimpan = '-';
            let mapelSimpan = '-';

            isProcessing = true;

            if (selectedStatus === 'Hadir') {
                const teksInput = document.getElementById('input-teks').value.trim();
                const kelasManual = document.getElementById('select-kelas-manual').value;
                const catatanHadir = document.getElementById('input-catatan-hadir').value.trim();

            if (!teksInput) {
                    tampilkanStatus("Kolom teks QR masih kosong.", "gagal");
                    isProcessing = false;
                    return;
                }

                tampilkanStatus("Memproses data kehadiran...", "sukses");

                const bagian = teksInput.split('|');
                if (bagian.length < 4 || bagian[0] !== 'ABSEN-GURU') {
                    tampilkanStatus("Format teks QR tidak valid atau salah.", "gagal");
                    isProcessing = false;
                    return;
                }

                namaGuru = bagian[1];
                const tanggalQr = bagian[2];
                tokenValidasi = bagian[3];
                statusSimpan = 'Hadir';
                
                if (kelasManual !== 'Otomatis') {
                    kelasSimpan = kelasManual;
                    mapelSimpan = 'Penyesuaian / Guru Pengganti';
                } else {
                    const infoJadwal = await deteksiKelasDanMapelOtomatis(namaGuru, waktuSekarang);
                    kelasSimpan = infoJadwal.kelas;
                    mapelSimpan = infoJadwal.mapel;
                }

                let infoTambahan = "";
                if (mapelSimpan === 'Tugas Piket') {
                    infoTambahan = " [Guru Piket Sekolah]";
                }

                let suffixCatatan = catatanHadir ? ` - Catatan: ${catatanHadir}` : '';
                keteranganSimpan = `Hadir via Scan QR (${mapelSimpan} - ${kelasSimpan})${infoTambahan}${suffixCatatan} (Pukul ${waktuSekarang})`;
                statusTugasSimpan = 'N/A';

                if (tanggalQr !== tanggalHariIni) {
                    tampilkanStatus(`QR Code untuk <b>${namaGuru}</b> sudah kedaluwarsa.`, "gagal");
                    isProcessing = false;
                    return;
                }

            } else if (selectedStatus === 'Izin') {
                const inputNama = document.getElementById('input-nama-izin').value.trim();
                const inputKet = document.getElementById('input-keterangan').value.trim();

                if (!inputNama || !inputKet) {
                    tampilkanStatus("Nama guru dan keterangan izin wajib diisi.", "gagal");
                    isProcessing = false;
                    return;
                }

                tampilkanStatus("Menyimpan data izin...", "sukses");
                namaGuru = inputNama;
                statusSimpan = 'Izin';
                keteranganSimpan = `${inputKet} (Pukul ${waktuSekarang})`;
                statusTugasSimpan = selectedTugas;
                tokenValidasi = 'MANUAL-IZIN';
                kelasSimpan = '-';
                mapelSimpan = '-';

            } else if (selectedStatus === 'Alfa') {
                const inputNamaAlfa = document.getElementById('input-nama-alfa').value.trim();

                if (!inputNamaAlfa) {
                    tampilkanStatus("Nama guru yang alfa wajib diisi.", "gagal");
                    isProcessing = false;
                    return;
                }

                tampilkanStatus("Menyimpan data alfa...", "sukses");
                namaGuru = inputNamaAlfa;
                statusSimpan = 'Alfa';
                keteranganSimpan = `Tanpa Keterangan (Alfa) - Dicatat pukul ${waktuSekarang}`;
                statusTugasSimpan = 'Belum Memberikan Tugas';
                tokenValidasi = 'MANUAL-ALFA';
                kelasSimpan = '-';
                mapelSimpan = '-';
            }

            // Pengecekan otomatis apakah nama guru termasuk daftar piket
            const cekPiket = listGuruPiket.some(piket => namaGuru.toLowerCase().includes(piket.toLowerCase()));

            try {
                const { error: insertError } = await supabaseClient
                    .from('presensi_guru')
                    .insert([{
                        nama_guru: namaGuru,
                        tanggal: tanggalHariIni,
                        token_validasi: tokenValidasi,
                        status: statusSimpan,
                        keterangan: keteranganSimpan,
                        status_tugas: statusTugasSimpan,
                        kelas: kelasSimpan,
                        mapel: mapelSimpan,
                        is_piket: cekPiket // Otomatis TRUE jika nama termasuk Hildan, Nadiv, atau Resma
                    }]);

                if (insertError) throw insertError;

                tampilkanStatus(`Presensi <b>${namaGuru}</b> (${statusSimpan} - ${kelasSimpan}) berhasil disimpan!`, "sukses");
                
                document.getElementById('input-teks').value = '';
                document.getElementById('select-kelas-manual').value = 'Otomatis';
                document.getElementById('input-catatan-hadir').value = '';
                document.getElementById('input-nama-izin').value = '';
                document.getElementById('input-keterangan').value = '';
                document.getElementById('input-nama-alfa').value = '';

                setTimeout(() => {
                    document.getElementById('status-box').classList.add('hidden');
                    isProcessing = false;
                }, 3500);

            } catch (err) {
                tampilkanStatus(`Kesalahan database: ${err.message}`, "gagal");
                isProcessing = false;
            }
        }
    </script>
</body>
</html>
